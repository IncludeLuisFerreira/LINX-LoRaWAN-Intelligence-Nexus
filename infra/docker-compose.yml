services:
  chirpstack:
    image: chirpstack/chirpstack:4
    command: -c /etc/chirpstack
    restart: unless-stopped
    volumes:
      - ./configuration/chirpstack:/etc/chirpstack
    depends_on:
      - postgres
      - mosquitto
      - redis
    environment:
      - MQTT_BROKER_HOST=mosquitto
      - REDIS_HOST=redis
      - POSTGRESQL_HOST=postgres
      # Credenciais MQTT da integracao do ChirpStack (allow_anonymous false
      # no broker desde #208). obrigatorias; defaults de dev em .env.example.
      - MQTT_CHIRPSTACK_USER=${MQTT_CHIRPSTACK_USER:?defina em infra/.env (veja .env.example)}
      - MQTT_CHIRPSTACK_PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?defina em infra/.env (veja .env.example)}
    ports:
      - "8080:8080"

  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "1700:1700/udp"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      - INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      - INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE=au915_0/gateway/{{ .GatewayID }}/command/#
      # Auth no broker (#208): o bridge usa a identidade `chirpstack` (ACL
      # readwrite au915_0/#). Sobrescreve o username/password vazios do .toml.
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=${MQTT_CHIRPSTACK_USER:?defina em infra/.env (veja .env.example)}
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?defina em infra/.env (veja .env.example)}
    depends_on:
      - mosquitto
  
  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-au915_0.toml
    ports:
      - "3001:3001"
    volumes:
      - ./configuration/chirpstack-gateway-bridge:/etc/chirpstack-gateway-bridge
    environment:
      - INTEGRATION__MQTT__AUTH__GENERIC__USERNAME=${MQTT_CHIRPSTACK_USER:?defina em infra/.env (veja .env.example)}
      - INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?defina em infra/.env (veja .env.example)}
    depends_on:
      - mosquitto

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure
    ports:
      - "8090:8090"
    depends_on:
      - chirpstack

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    volumes:
      - ./configuration/postgresql/initdb:/docker-entrypoint-initdb.d
      - postgresqldata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=chirpstack
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatorio}
      - POSTGRES_DB=chirpstack

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      # config/ traz mosquitto.conf + mosquitto.passwd + mosquitto.acl
      # (gerados por infra/scripts/gen-mosquitto-passwd.sh). Read-only.
      - ./configuration/mosquitto/config/:/mosquitto/config/:ro
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    networks:
      # O routing do stack deploy entra nesta rede externa para consumir os
      # uplinks publicados pelo ChirpStack (#188).
      - default
      - linx-network

  # One-shot: garante que mosquitto.passwd exista antes de subir o broker
  # (allow_anonymous false exige password_file). Em dev, gera com as mesmas
  # credenciais do .env; em producao, use gen-mosquitto-passwd.sh e commit zero
  # de hash. NAO sobe se o arquivo ja existe (idempotente).
  mosquitto-init:
    image: eclipse-mosquitto:2
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        { [ -f /mosquitto/config/mosquitto.passwd ] || {
        mosquitto_passwd -c -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_CHIRPSTACK_USER" "$$MQTT_CHIRPSTACK_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_ROUTING_USER" "$$MQTT_ROUTING_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_HEALTHCHECK_USER" "$$MQTT_HEALTHCHECK_PASSWORD";
        }; } &&
        chmod 0644 /mosquitto/config/mosquitto.passwd
        /mosquitto/config/mosquitto.acl;
        chown 1883:1883 /mosquitto/config/mosquitto.passwd
        /mosquitto/config/mosquitto.acl 2>/dev/null || true
    environment:
      - MQTT_CHIRPSTACK_USER=${MQTT_CHIRPSTACK_USER:?defina em infra/.env (veja .env.example)}
      - MQTT_CHIRPSTACK_PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?defina em infra/.env (veja .env.example)}
      - MQTT_ROUTING_USER=${MQTT_ROUTING_USER:-routing}
      - MQTT_ROUTING_PASSWORD=${MQTT_ROUTING_PASSWORD:?defina em infra/.env (veja .env.example)}
      - MQTT_HEALTHCHECK_USER=${MQTT_HEALTHCHECK_USER:-healthcheck}
      - MQTT_HEALTHCHECK_PASSWORD=${MQTT_HEALTHCHECK_PASSWORD:?defina em infra/.env (veja .env.example)}
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/

networks:
  # Rede compartilhada com o stack deploy. Criada por
  # deploy/scripts/bootstrap-network.sh antes de subir os stacks.
  linx-network:
    external: true

volumes:
  postgresqldata:
  redisdata:
