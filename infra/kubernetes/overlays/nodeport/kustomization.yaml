apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: identity-api
        namespace: linx
      spec:
        type: NodePort
        ports:
          - name: http
            port: 8000
            targetPort: http
            nodePort: 30080
