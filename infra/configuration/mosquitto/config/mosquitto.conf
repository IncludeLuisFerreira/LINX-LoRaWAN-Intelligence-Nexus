# Mosquitto MQTT broker — issue #208: sem anonimato + auth + ACL.
#
# `allow_anonymous false`: nenhuma conexão sem usuário/senha é aceita.
# `password_file` e `acl_file` referenciam caminhos montados no container
# (o diretório `config/` inteiro é montado em /mosquitto/config). Gere o
# arquivo de senhas real com:
#   infra/scripts/gen-mosquitto-passwd.sh
# O `mosquitto.passwd` real NÃO é versionado (ver .gitignore); apenas o
# `.example` (template) e o `mosquitto.acl` são.

listener 1883
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl
# Nota: em mosquitto 2.x o ACL built-in já NEGA por padrão qualquer tópico sem
# regra correspondente no `mosquitto.acl` (não existe `acl_default` aqui).
