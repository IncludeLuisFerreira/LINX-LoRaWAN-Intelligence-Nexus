# Mosquitto MQTT broker — issue #208 (sem anonimato + auth + ACL) e #81 (TLS).
#
# `allow_anonymous false`: nenhuma conexão sem usuário/senha é aceita.
# `password_file` e `acl_file` referenciam caminhos montados no container
# (o diretório `config/` inteiro é montado em /mosquitto/config). Gere o
# arquivo de senhas real com:
#   infra/scripts/gen-mosquitto-passwd.sh
# O `mosquitto.passwd` real NÃO é versionado (ver .gitignore); apenas o
# `.example` (template) e o `mosquitto.acl` são.
#
# TLS (#81): único listener na 8883, com certificado de servidor assinado pela
# CA local. Gere CA + certificado com:
#   infra/scripts/gen-mosquitto-certs.sh
# A 1883 plaintext foi REMOVIDA: conexões não-TLS nessa porta falham (não há
# listener). Todos os clientes internos usam `ssl://<host>:8883` e confiam em
# /mosquitto/certs/ca.crt. `require_certificate false` = TLS de servidor
# (autenticação do cliente continua por usuário/senha + ACL, como antes).

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
allow_anonymous false
password_file /mosquitto/config/mosquitto.passwd
acl_file /mosquitto/config/mosquitto.acl
# Nota: em mosquitto 2.x o ACL built-in já NEGA por padrão qualquer tópico sem
# regra correspondente no `mosquitto.acl` (não existe `acl_default` aqui).
