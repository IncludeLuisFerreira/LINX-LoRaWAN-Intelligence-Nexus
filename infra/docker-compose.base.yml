services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=linx
      - POSTGRES_PASSWORD=linx
      - POSTGRES_DB=linx
    volumes:
      - postgresqldata_base:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata_base:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # TLS obrigatorio (#81): a 1883 plaintext foi removida do listener.
      - "8883:8883"
    volumes:
      - ./configuration/mosquitto/config/:/mosquitto/config/
      # Gerados por infra/scripts/gen-mosquitto-certs.sh (#81).
      - ./configuration/mosquitto/certs/:/mosquitto/certs/:ro

volumes:
  postgresqldata_base:
  redisdata_base:
