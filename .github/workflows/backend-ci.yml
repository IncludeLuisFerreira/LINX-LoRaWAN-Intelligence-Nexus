name: backend-ci

on:
  pull_request:
    paths:
      - "saas_backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "saas_backend/**"
      - ".github/workflows/backend-ci.yml"

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.4.1"

jobs:
  lint:
    name: Lint & Type Check (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, identity_api, agent_bridge]
    defaults:
      run:
        working-directory: saas_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: poetry -C ${{ matrix.package }} install

      - name: Black (format check)
        run: poetry -C ${{ matrix.package }} run black --check src tests

      - name: isort (import order check)
        run: poetry -C ${{ matrix.package }} run isort --check-only src tests

      - name: Flake8 (lint)
        run: poetry -C ${{ matrix.package }} run flake8 src tests

      - name: Mypy (type check)
        run: poetry -C ${{ matrix.package }} run mypy src tests

  test:
    name: Tests & Coverage (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, identity_api, agent_bridge]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: linx
          POSTGRES_PASSWORD: linx
          POSTGRES_DB: linx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linx -d linx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: saas_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          poetry -C shared install
          poetry -C identity_api install
          poetry -C agent_bridge install

      - name: Apply migrations
        run: poetry -C identity_api run alembic -c ../alembic.ini upgrade head

      - name: Pytest (cobertura >= 70%)
        run: poetry -C ${{ matrix.package }} run pytest --cov=src --cov-report=term-missing --cov-fail-under=70
