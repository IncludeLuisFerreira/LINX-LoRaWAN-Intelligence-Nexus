name: Frontend CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint, Typecheck & OpenAPI Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # >=22.19: jsdom@30 -> undici@8 usa worker_threads.markAsUncloneable,
          # ausente no Node 20 (quebra o `require('jsdom')` no vitest).
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './client/frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate OpenAPI Contract (Redocly)
        run: npx @redocly/cli lint openapi-stub.yaml

      - name: Run Linter (OxLint / ESLint)
        run: npm run lint

      - name: Check TypeScript Types
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build Application
        run: npm run build
        working-directory: ./client/frontend
        env:
          VITE_API_URL: /api/v1
          VITE_ENABLE_MOCKS: 'false'

  nginx-template:
    name: Nginx Template (execução isolada)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image e valida 'nginx -t' sem variáveis extras
        run: ./scripts/check-nginx-template.sh
        working-directory: ./client/frontend

      - name: Security headers guard
        run: |
          ./scripts/check-security-headers.sh
          python3 scripts/test_check_security_headers.py

