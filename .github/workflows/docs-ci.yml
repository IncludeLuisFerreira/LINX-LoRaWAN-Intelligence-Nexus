name: docs-ci

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - "SPRINTS_BACKLOG.md"
      - ".github/workflows/docs-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "poetry.lock"
      - "SPRINTS_BACKLOG.md"
      - ".github/workflows/docs-ci.yml"

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"

jobs:
  build:
    name: MkDocs Build (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry

      - name: Install dependencies
        run: poetry install

      - name: MkDocs check (links, nav e build estrito)
        run: poetry run mkdocs build --strict

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkdocs-site
          path: site/
          retention-days: 7
