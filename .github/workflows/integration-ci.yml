name: integration-ci

on:
  pull_request:
    paths:
      - "tests/integration/**"
      - "client/services/telemetry_consumer/**"
      - "middleware/services/routing/**"
      - "deploy/docker-compose.yml"
      - "client/db/**"
      - "deploy/.env.example"
      - ".github/workflows/integration-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "tests/integration/**"
      - "client/services/telemetry_consumer/**"
      - "middleware/services/routing/**"
      - "deploy/docker-compose.yml"
      - "client/db/**"
      - "deploy/.env.example"
      - ".github/workflows/integration-ci.yml"

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.4.1"

permissions:
  contents: read

jobs:
  integration:
    name: Testes de integração ponta-a-ponta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: pipx install "poetry==${POETRY_VERSION}"

      - name: Run integration suite
        run: tests/integration/run.sh

      - name: Dump compose logs on failure
        if: failure()
        run: >-
          docker compose -p lynx-integration
          --env-file tests/integration/telemetry/test.env
          -f deploy/docker-compose.yml
          -f tests/integration/telemetry/docker-compose.override.yml
          logs --tail 120
