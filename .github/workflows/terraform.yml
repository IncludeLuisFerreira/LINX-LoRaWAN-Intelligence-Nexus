name: "Terraform CI/CD"

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Ação do Terraform'
        required: true
        default: 'apply'
        type: choice
        options: [apply, destroy]
      key_name:
        description: 'EC2 Key Pair na AWS'
        required: true
        default: 'vockey'

permissions:
  contents: read

# Serializa plan (PR/push) e apply/destroy (manual): uma execução por vez,
# sem cancelar a anterior, para proteger o state remoto do Terraform.
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  # Valida e planeja em PRs e commits para develop/main (state no backend
  # S3 do main.tf). Apply/destroy não roda aqui: ver job `orchestration`.
  terraform-plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: infra/terraform

    env:
      AWS_REGION: "us-east-1"
      TF_VAR_key_name: ${{ vars.TF_VAR_KEY_NAME }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      # Só comenta no PR se o gatilho original for um Pull Request
      - name: Comentar Plan no PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Initialization ⚙️ \`${{ steps.init.outcome }}\`
            #### Terraform Validation 🤖 \`${{ steps.validate.outcome }}\`
            #### Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Mostrar Plano Completo</summary>

            \`\`\`hcl
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Validar Status do Plan
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # Apply/destroy sob demanda (workflow_dispatch). O runner não alcança a
  # API do K3s (porta 6443 restrita à VPC), então o kubectl roda no master
  # via SSH. No apply, após o Terraform, faz o deploy dos manifests.
  orchestration:
    name: "Terraform Apply/Destroy + Deploy"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    env:
      AWS_REGION: "us-east-1"
      # Mapa CHAVE=VALOR (formato --env-file) entregue ao master por stdin
      # na sessão SSH única do deploy; nunca impresso no log.
      LINX_SECRETS_ENV: ${{ secrets.LINX_SECRETS_ENV }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply ou Destroy
        env:
          TF_VAR_key_name: ${{ github.event.inputs.key_name }}
        run: |
          terraform ${{ github.event.inputs.action }} \
            -input=false -no-color -auto-approve

      # A partir daqui, apenas no apply: no destroy a instância master é
      # removida pelo próprio Terraform, não há destino para SSH/deploy.
      - name: Configurar chave SSH
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa && chmod 600 ~/.ssh/id_rsa

      - name: Obter IP público do master
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          MASTER_IP=$(terraform output -raw master_public_ip)
          echo "MASTER_IP=${MASTER_IP}" >> $GITHUB_ENV

      # Na primeira inicialização o sshd pode demorar a subir logo após o
      # apply; retry limitado para popular o known_hosts antes do primeiro ssh.
      - name: Registrar host key do master
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          for i in $(seq 1 30); do
            ssh-keyscan -H "$MASTER_IP" >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 5
          done

      # Readiness sem retry cego: falha se o cloud-init não concluir ou os
      # nós não ficarem Ready dentro do timeout.
      - name: Aguardar readiness do cluster
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          ssh ubuntu@${{ env.MASTER_IP }} \
            "cloud-init status --wait && kubectl wait --for=condition=Ready nodes --all --timeout=120s"

      # Deploy: namespace + secret numa única sessão SSH (secret via stdin,
      # sem arquivo temporário no runner), depois os manifests renderizados
      # com kustomize no runner e aplicados no master.
      - name: Deploy dos manifests (kubectl no master via SSH)
        if: ${{ github.event.inputs.action == 'apply' }}
        run: |
          echo "$LINX_SECRETS_ENV" | ssh ubuntu@${{ env.MASTER_IP }} "
            kubectl create namespace linx --dry-run=client -o yaml | kubectl apply -f - &&
            kubectl create secret generic linx-secrets -n linx \
              --from-env-file=/dev/stdin --dry-run=client -o yaml | kubectl apply -f -
          "
          kubectl kustomize ${{ github.workspace }}/infra/kubernetes | ssh ubuntu@${{ env.MASTER_IP }} "kubectl apply -f -"
          ssh ubuntu@${{ env.MASTER_IP }} "kubectl get all -A"
