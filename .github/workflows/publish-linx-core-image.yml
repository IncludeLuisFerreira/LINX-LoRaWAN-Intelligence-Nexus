name: Publish Linx Core Image

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      repository:
        required: true
        type: string
      context:
        required: false
        type: string
        default: linx_core
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.service }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Definir tags
        id: tags
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          tags="${{ inputs.repository }}:sha-${short_sha}"
          if [[ "$GITHUB_REF" == "refs/heads/develop" ]]; then
            tags+=$'\n'"${{ inputs.repository }}:dev"
          fi
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=$'\n'"${{ inputs.repository }}:latest"
          fi
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$tags" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ inputs.service }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Validar manifesto publicado
        shell: bash
        run: |
          docker manifest inspect \
            "${{ inputs.repository }}:sha-${{ steps.tags.outputs.short_sha }}" >/dev/null
