name: isolation-ci

on:
  pull_request:
    paths:
      - "scripts/test_isolation*.py"
      - ".github/workflows/isolation-ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "scripts/test_isolation*.py"
      - ".github/workflows/isolation-ci.yml"

permissions:
  contents: read

jobs:
  isolation:
    name: Isolation guard (dry-run + smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Isolation dry-run
        run: python3 scripts/test_isolation.py --dry-run

      - name: Isolation smoke
        run: python3 scripts/test_isolation_smoke.py
