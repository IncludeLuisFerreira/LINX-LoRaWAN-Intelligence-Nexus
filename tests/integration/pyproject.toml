[project]
name = "lynx-integration-tests"
version = "0.1.0"
description = "Testes de integração ponta-a-ponta da plataforma LINX."
requires-python = ">=3.12,<4.0"
dependencies = [
    "rabbitpy (>=3.0.2,<4.0.0)",
    "websockets (>=13.0,<18.0)",
    "httpx (>=0.28.0,<1.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: requer a stack docker-compose de tests/integration",
]
addopts = "-p no:cacheprovider"
