services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-linx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-linx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-linx} -d ${POSTGRES_DB:-linx}
      interval: 10s
      timeout: 5s
      retries: 5

  identity_api:
    build:
      context: .
      dockerfile: identity_api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent_bridge:
    build:
      context: .
      dockerfile: agent_bridge/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    ports:
      # 50051 expõe GetAppConfig (sem auth). Restrinja no Security Group ao IP
      # do Client Agent; nunca a 0.0.0.0/0. Ver README (Runbook — Security Group).
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
