[project]
name = "saas-backend"
version = "0.1.0"
description = "Task runner do módulo SaaS (identity_api + agent_bridge)."
requires-python = ">=3.12,<4.0"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)"
]

[tool.taskipy.tasks]
run = "bash scripts/run.sh"
run-docker = "docker compose up --build"
up = "docker compose up -d --build"
down = "docker compose down"
migrate = "poetry -C identity_api run alembic -c ../alembic.ini upgrade head"
migration = "poetry -C identity_api run alembic -c ../alembic.ini revision --autogenerate -m"
test = "poetry -C shared run pytest && poetry -C identity_api run pytest && poetry -C agent_bridge run pytest"
