[project]
name = "saas-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "includeLuisFerreira",email = "prgluisfelipe@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "psycopg (>=3.3.4,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "httpx2 (>=2.12.0,<3.0.0)"
]

[tool.poetry]
packages = [{include="linx", from="src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.isort]
profile = "black"
line_length = 79

[tool.taskipy.tasks]

# FERRAMENTAS DE LINT
lint-check = "black --check --diff . && isort --check --diff ."
mypy = "mypy src/ "
flake8 = "flake8 src/"
lint = "black . && isort . && mypy src/ && flake8 src/"

# FERRAMENTAS DE TEST
pre_test = "task lint"
test = "pytest -s -x --cov=src -vv && coverage html && coverage report -m"

# FERRAMENTAS DE RUN

pre_run = "task test "
run = "poetry run uvicorn linx.main:app --reload"