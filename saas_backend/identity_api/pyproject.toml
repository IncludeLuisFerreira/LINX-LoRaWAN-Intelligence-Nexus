[project]
name = "identity-api"
version = "0.1.0"
description = "Serviço REST de identidade e catálogo do SaaS."
authors = [
    {name = "includeLuisFerreira",email = "prgluisfelipe@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include="identity_api", from="src"}]

[tool.poetry.dependencies]
linx-shared = { path = "../shared", develop = true }
fastapi = ">=0.141.1,<0.142.0"
uvicorn = { version = ">=0.52.4,<0.53.0", extras = ["standard"] }
jinja2 = ">=3.1.6,<4.0.0"
sqlalchemy = ">=2.0.52,<3.0.0"
psycopg = { version = ">=3.3.4,<4.0.0", extras = ["binary"] }
alembic = ">=1.19.1,<2.0.0"
pydantic = ">=2.13.5,<3.0.0"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "httpx2 (>=2.13.0,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.taskipy.tasks]
lint-check = "black --check --diff . && isort --check --diff ."
mypy = "mypy src/ tests/"
flake8 = "flake8 src/ tests/"
lint = "black . && isort . && mypy src/ tests/ && flake8 src/ tests/"
test = "pytest -s -x --cov=src -vv"
run = "poetry run uvicorn identity_api.main:app --reload"
