[project]
name = "agent-bridge"
version = "0.1.0"
description = "Servidor gRPC AgentBridge (GetAppConfig / ReportViolation)."
authors = [
    {name = "includeLuisFerreira",email = "prgluisfelipe@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include="agent_bridge", from="src"}]

[tool.poetry.dependencies]
linx-shared = { path = "../shared", develop = true }
grpcio = ">=1.84.0,<2.0.0"
protobuf = ">=7.36.1,<8.0.0"
sqlalchemy = ">=2.0.52,<3.0.0"
psycopg = { version = ">=3.3.4,<4.0.0", extras = ["binary"] }
pydantic-settings = ">=2.15.0,<3.0.0"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "grpcio-tools (>=1.84.0,<2.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[tool.taskipy.tasks]
lint-check = "black --check --diff . && isort --check --diff ."
mypy = "mypy src/ tests/"
flake8 = "flake8 src/ tests/"
lint = "black . && isort . && mypy src/ tests/ && flake8 src/ tests/"
test = "pytest -s -x --cov=src -vv"
run = "poetry run python -m agent_bridge.server"
