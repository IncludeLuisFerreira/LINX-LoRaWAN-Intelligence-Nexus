services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-linx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-linx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-linx} -d ${POSTGRES_DB:-linx}
      interval: 10s
      timeout: 5s
      retries: 5

  identity_api:
    build:
      context: ../linx_core/.
      dockerfile: services/identity_api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
      - CHIRPSTACK_HOST=${CHIRPSTACK_HOST:-localhost:8080}
      - CHIRPSTACK_API_TOKEN=${CHIRPSTACK_API_TOKEN:?CHIRPSTACK_API_TOKEN must be set}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      identity_api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --no-check-certificate -O - https://127.0.0.1/health >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent_bridge:
    build:
      context: ../linx_core/.
      dockerfile: services/agent_bridge/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    ports:
      # 50051 expõe GetAppConfig (sem auth). Restrinja no Security Group ao IP
      # do Client Agent; nunca a 0.0.0.0/0. Ver README (Runbook — Security Group).
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

  client_agent:
    build:
      context: ../middleware/services/client_agent/.
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Hosts são nomes de serviço do Compose, não "localhost".
      - SAAS_GRPC_HOST=${SAAS_GRPC_HOST:-agent_bridge:50051}
      - TENANT_APP_URL=${TENANT_APP_URL:-http://tenant_app:8002}
      - GRPC_TIMEOUT_SECONDS=${GRPC_TIMEOUT_SECONDS:-5}
      - CONFIG_CACHE_TTL_SECONDS=${CONFIG_CACHE_TTL_SECONDS:-60}
    depends_on:
      agent_bridge:
        condition: service_started
      tenant_app:
        condition: service_started
    ports:
      - "8001:8001"

  timescaledb:
    image: timescale/timescaledb:2.13.0-pg14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/0_schema.sql
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  tenant_app:
    build: ../client/.
    restart: unless-stopped
    # SAAS_GRPC_HOST deve apontar para o endereço alcançável do Linx Core
    # a partir do container (não use "localhost" aqui).
    environment:
      - CLIENT_AGENT_URL=${CLIENT_AGENT_URL:-http://client_agent:8001}
      - APP_ID=${APP_ID}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - SAAS_GRPC_HOST=${SAAS_GRPC_HOST:-agent_bridge:50051}
      - DB_HOST=timescaledb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      timescaledb:
        condition: service_healthy
      agent_bridge:
        condition: service_started
      identity_api:
        condition: service_started
    ports:
      - "${TENANT_PORT:-8002}:8002"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ../infra/configuration/mosquitto/config:/mosquitto/config:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -W 3 -C 1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  routing:
    build:
      context: ../
      dockerfile: middleware/services/routing/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-application/+/device/+/event/up}
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-5}
      - RABBIT_URL=${RABBIT_URL:-amqp://guest:guest@rabbitmq:5672/%2f}
      - RABBIT_EXCHANGE=${RABBIT_EXCHANGE:-linx.telemetry}
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  timescaledb_data:
  rabbitmq_data:
