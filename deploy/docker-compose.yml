services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-linx}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB:-linx}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-linx} -d ${POSTGRES_DB:-linx}
      interval: 10s
      timeout: 5s
      retries: 5

  identity_api:
    build:
      context: ../linx_core/.
      dockerfile: services/identity_api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
      - CHIRPSTACK_HOST=${CHIRPSTACK_HOST:-localhost:8080}
      - CHIRPSTACK_API_TOKEN=${CHIRPSTACK_API_TOKEN:?CHIRPSTACK_API_TOKEN must be set}
      - SERVICE_TOKEN=${SERVICE_TOKEN:?SERVICE_TOKEN must be set}
      - RABBITMQ_MANAGEMENT_URL=${RABBITMQ_MANAGEMENT_URL:-http://rabbitmq:15672}
      - RABBITMQ_ADMIN_USER=${RABBITMQ_ADMIN_USER:-linx}
      - RABBITMQ_ADMIN_PASSWORD=${RABBITMQ_ADMIN_PASSWORD:?RABBITMQ_ADMIN_PASSWORD must be set}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_TENANT_SECRET=${RABBITMQ_TENANT_SECRET:?RABBITMQ_TENANT_SECRET must be set}
      - RABBITMQ_AMQP_HOST=${RABBITMQ_AMQP_HOST:-rabbitmq:5672}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      identity_api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --no-check-certificate -O - https://127.0.0.1/health >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  agent_bridge:
    build:
      context: ../linx_core/.
      dockerfile: services/agent_bridge/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-linx}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-linx}
      - GRPC_HOST=0.0.0.0
      - GRPC_PORT=50051
    ports:
      # 50051 expõe GetAppConfig (sem auth). Restrinja no Security Group ao IP
      # do Client Agent; nunca a 0.0.0.0/0. Ver README (Runbook — Security Group).
      - "50051:50051"
    depends_on:
      db:
        condition: service_healthy

  client_agent:
    build:
      context: ../middleware/services/client_agent/.
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Hosts são nomes de serviço do Compose, não "localhost".
      - SAAS_GRPC_HOST=${SAAS_GRPC_HOST:-agent_bridge:50051}
      - GRPC_TIMEOUT_SECONDS=${GRPC_TIMEOUT_SECONDS:-5}
      - CONFIG_CACHE_TTL_SECONDS=${CONFIG_CACHE_TTL_SECONDS:-60}
    depends_on:
      agent_bridge:
        condition: service_started
    ports:
      - "8001:8001"

  timescaledb:
    image: timescale/timescaledb:2.13.0-pg14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER must be set}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set}
      - POSTGRES_DB=${DB_NAME:?DB_NAME must be set}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/0_schema.sql
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  telemetry_consumer:
    build:
      context: ../client/services/telemetry_consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ID=${APP_ID}
      - RABBIT_URL=amqp://tenant.${APP_ID}:${RABBITMQ_TENANT_PASS}@rabbitmq:5672/%2f
      - DB_HOST=timescaledb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      # Bind SOMENTE em loopback (#208): a 1883 nunca vai para 0.0.0.0.
      # ChirpStack/routing alcançam o broker pela rede do Compose
      # (nome de serviço `mosquitto`), não por esta porta publicada.
      - "127.0.0.1:1883:1883"
    volumes:
      - ../infra/configuration/mosquitto/config:/mosquitto/config:ro
    environment:
      - MQTT_HEALTHCHECK_USER=${MQTT_HEALTHCHECK_USER:-healthcheck}
      - MQTT_HEALTHCHECK_PASSWORD=${MQTT_HEALTHCHECK_PASSWORD:?MQTT_HEALTHCHECK_PASSWORD must be set}
    depends_on:
      mosquitto-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -u \"$${MQTT_HEALTHCHECK_USER}\" -P \"$${MQTT_HEALTHCHECK_PASSWORD}\" -t '$$SYS/broker/uptime' -W 3 -C 1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # One-shot: gera o mosquitto.passwd (allow_anonymous false exige password_file
  # — #208) a partir das credenciais do .env, com os usuários do
  # mosquitto.acl (chirpstack, routing, healthcheck). Idempotente: nao reescreve
  # se o arquivo ja existe. O hash real NAO e versionado (.gitignore).
  mosquitto-init:
    image: eclipse-mosquitto:2
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - >
        { [ -f /mosquitto/config/mosquitto.passwd ] || {
        mosquitto_passwd -c -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_CHIRPSTACK_USER" "$$MQTT_CHIRPSTACK_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_ROUTING_USER" "$$MQTT_ROUTING_PASSWORD" &&
        mosquitto_passwd -b /mosquitto/config/mosquitto.passwd
        "$$MQTT_HEALTHCHECK_USER" "$$MQTT_HEALTHCHECK_PASSWORD";
        }; } &&
        chmod 0644 /mosquitto/config/mosquitto.passwd
        /mosquitto/config/mosquitto.acl;
        chown 1883:1883 /mosquitto/config/mosquitto.passwd
        /mosquitto/config/mosquitto.acl 2>/dev/null || true
    environment:
      - MQTT_CHIRPSTACK_USER=${MQTT_CHIRPSTACK_USER:?MQTT_CHIRPSTACK_USER must be set}
      - MQTT_CHIRPSTACK_PASSWORD=${MQTT_CHIRPSTACK_PASSWORD:?MQTT_CHIRPSTACK_PASSWORD must be set}
      - MQTT_ROUTING_USER=${MQTT_ROUTING_USER:-routing}
      - MQTT_ROUTING_PASSWORD=${MQTT_ROUTING_PASSWORD:?MQTT_ROUTING_PASSWORD must be set}
      - MQTT_HEALTHCHECK_USER=${MQTT_HEALTHCHECK_USER:-healthcheck}
      - MQTT_HEALTHCHECK_PASSWORD=${MQTT_HEALTHCHECK_PASSWORD:?MQTT_HEALTHCHECK_PASSWORD must be set}
    volumes:
      - ../infra/configuration/mosquitto/config:/mosquitto/config

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-linx}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS must be set}
    ports:
      # Publicados apenas no loopback do host. O management UI (15672) e o
      # AMQP (5672) nunca devem ir para 0.0.0.0/0.
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  routing:
    build:
      context: ../
      dockerfile: middleware/services/routing/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-mosquitto}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
      - MQTT_TOPIC=${MQTT_TOPIC:-application/+/device/+/event/up}
      # Auth no broker (#208, allow_anonymous false): identidade de leitura
      # `routing` (ACL read-only em application/#).
      - MQTT_USERNAME=${MQTT_ROUTING_USER:-routing}
      - MQTT_PASSWORD=${MQTT_ROUTING_PASSWORD:?MQTT_ROUTING_PASSWORD must be set}
      - RABBIT_URL=${RABBIT_URL:-amqp://${RABBITMQ_DEFAULT_USER:-linx}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f}
      - RABBIT_EXCHANGE_PREFIX=${RABBIT_EXCHANGE_PREFIX:-linx.telemetry}
      - RABBIT_AUDIT_QUEUE=${RABBIT_AUDIT_QUEUE:-linx.telemetry.audit}
    depends_on:
      mosquitto:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  timescaledb_data:
  rabbitmq_data:
