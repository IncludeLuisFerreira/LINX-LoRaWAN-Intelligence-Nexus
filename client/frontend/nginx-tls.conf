# Borda HTTPS do dashboard (issue #73 / RNF-004).
#
# Este arquivo NÃO entra na imagem do frontend: é montado no serviço
# `frontend-tls` do client/docker-compose.yml. O nginx interno do container
# `frontend` continua servindo a SPA e fazendo proxy de /api e /ws; aqui só
# terminamos o TLS, renovamos o certificado via webroot e redirecionamos HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Desafio HTTP-01 do Certbot precisa permanecer em HTTP (ACME RFC 8555).
    # O diretório é gravado pelo container certbot e lido daqui somente leitura.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:TLS_FRONTEND:10m;
    ssl_session_timeout 10m;

    # DNS embutido do Docker: resolve o nome do serviço `frontend` por
    # variável para não cachear o IP do container (padrão usado no deploy/).
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    location / {
        set $frontend "frontend:80";
        proxy_pass http://$frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A borda é o único ponto HTTPS; o nginx interno precisa saber que a
        # requisição original chegou por TLS para propagar o esquema ao /api.
        proxy_set_header X-Forwarded-Proto https;

        # WSS de telemetria: repassa o upgrade ao nginx do frontend.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
