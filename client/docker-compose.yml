services:
  timescaledb:
    image: timescale/timescaledb:2.13-pg14
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/0_schema.sql
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
  telemetry_consumer:
    build:
      context: ./services/telemetry_consumer
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ID=${APP_ID}
      - RABBIT_URL=${RABBIT_URL}
      - DB_HOST=timescaledb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Token exigido no REST/WS de telemetria (#211); o nginx do frontend
      # injeta o mesmo valor no header X-Service-Token dos proxies /api e /ws.
      - SERVICE_TOKEN=${SERVICE_TOKEN:?SERVICE_TOKEN must be set}
    depends_on:
      timescaledb:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_ENABLE_MOCKS: ${VITE_ENABLE_MOCKS:-false}
    restart: unless-stopped
    environment:
      # Destino do proxy /api do nginx do dashboard (backend do plano de controle).
      - BACKEND_URL=${BACKEND_URL:?BACKEND_URL must be set}
      # Token de serviço injetado pelo nginx no proxy /api (nunca chega ao browser).
      - SERVICE_TOKEN=${SERVICE_TOKEN:?SERVICE_TOKEN must be set}
      # Destino do proxy /ws/ do nginx (WebSocket de telemetria).
      - WS_BACKEND_URL=${WS_BACKEND_URL:-http://telemetry_consumer:8000}
    # Sem publicação direta: o dashboard só é alcançado pela borda TLS.
    expose:
      - "80"

  # Borda HTTPS (issue #73): termina o TLS em 443, redireciona 80 -> 443 e
  # encaminha para o nginx interno do serviço `frontend`.
  frontend-tls:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      # fullchain.pem + privkey.pem, gravados por scripts/frontend-cert.sh.
      - ./certs:/etc/nginx/certs:ro
      # Webroot do desafio HTTP-01 do Certbot (somente leitura no nginx).
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # One-shot usado por scripts/frontend-cert.sh (issue/renew). Fora do profile
  # padrão para não subir junto com a stack.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: ["certbot", "renew", "--webroot", "-w", "/var/www/certbot"]

volumes:
  timescaledb_data:
