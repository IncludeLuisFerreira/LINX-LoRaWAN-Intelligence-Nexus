[project]
name = "telemetry-consumer"
version = "0.1.0"
description = ""
authors = [
    {name = "includeLuisFerreira",email = "prgluisfelipe@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "rabbitpy (>=3.0.2,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.0.0,<2.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "asyncpg-stubs (>=0.31.3,<0.32.0)"
]

[tool.poetry]
packages = [{include="telemetry_consumer", from="src"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]
exclude = [".venv/"]

[tool.taskipy.tasks]

# FERRAMENTAS DE LINT
lint-check = "black --check --diff . && isort --check --diff ."
mypy = "mypy src/ tests/"
flake8 = "flake8 src/ tests/"
lint = "black . && isort . && mypy src/ tests/ && flake8 src/ tests/"

# FERRAMENTAS DE TEST
pre_test = "task lint"
test = "pytest -s -x --cov=src -vv && coverage html && coverage report -m"

# FERRAMENTAS DE RUN
run = "poetry run uvicorn telemetry_consumer.app:app --host 0.0.0.0 --port 8000"
run_reload = "poetry run uvicorn telemetry_consumer.app:app --reload"
