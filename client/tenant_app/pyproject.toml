[project]
name = "linx-tenant-app"
version = "0.1.0"
description = "App FastAPI mínimo provisionado por aplicação no LINX."
authors = [
    {name = "includeLuisFerreira",email = "prgluisfelipe@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "tenant_app", from = "src"}]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.0,<1.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 79

[tool.mypy]

[tool.taskipy.tasks]
lint-check = "black --check --diff . && isort --check --diff ."
mypy = "mypy src/ tests/"
flake8 = "flake8 src/ tests/"
lint = "black . && isort . && mypy src/ tests/ && flake8 src/ tests/"
test = "pytest -q"
