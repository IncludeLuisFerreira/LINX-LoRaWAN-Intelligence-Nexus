site_name: LINX — LoRaWAN Intelligence Nexus
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.tabs
    - search.suggest
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Arquitetura (PRD): PRD_PLATAFORMA_IOT.md
  - Comunicação entre Serviços: comunicacao_entre_servicos.md
  - Consistência e Replicação: consistencia_replicacao.md
  - Demo da Entrega 3: demo_entrega3.md
  - Módulos do Sistema:
      - Linx Core: linx_core/README.md
      - Middleware: middleware/README.md
      - Client (Tenant App): client/README.md
      - Migração do Telemetry Consumer: telemetry-consumer/migration.md
      - Isolamento RabbitMQ por Tenant: telemetry-consumer/rabbitmq-isolation.md
  - DevOps:
      - Imagem do Tenant App: devops/tenant-app-image.md
      - CI/CD do cluster K3s na AWS: devops/k3s-aws-ci-cd.md
  - Manuais e Documentação:
      - Análise de Segurança ChirpStack: analise_seguranca_chirpstack/chirpstack_security_analysis.md
      - Estrutura de Pastas: estrutura_de_pastas/estrutura.md
      - Guia de Reprodução: manuais_de_config_e_impl/guia_reproducao_fase_inicial.md

exclude_docs: |
  superpowers/*
  superpowers/**/*