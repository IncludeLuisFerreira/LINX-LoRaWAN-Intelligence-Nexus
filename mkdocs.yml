site_name: LINX — LoRaWAN Intelligence Nexus
theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
  features:
    - navigation.tabs
    - search.suggest
    - content.code.copy

nav:
  - Início: index.md
  - Arquitetura (PRD): PRD_PLATAFORMA_IOT.md
  - Módulos do Sistema:
      - SaaS Backend: saas_backend/README.md
      - Client Agent API: client_agent_api/README.md
      - Tenant App Template: tenant_app_template/README.md
  - Manuais e Documentação:
      - Análise de Segurança ChirpStack: analise_seguranca_chirpstack/chirpstack_security_analysis.md
      - Estrutura de Pastas: estrutura_de_pastas/estrutura.md
      - Guia de Reprodução: manuais_de_config_e_impl/guia_reproducao_fase_inicial.md
  - Sprints e Backlog: SPRINTS_BACKLOG.md

exclude_docs: |
  superpowers/*
  superpowers/**/*